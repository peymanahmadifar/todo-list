<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کارهای من | مینیمال</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #27272a;
      border-radius: 9999px;
    }
    .sortable-ghost {
      opacity: 0.35;
      background-color: #1e1b4b !important;
      border: 1px dashed #6366f1 !important;
    }
    .sortable-drag {
      cursor: grabbing !important;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-2.5 sm:p-6 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- کانتینر اصلی اپلیکیشن -->
  <div class="w-full max-w-lg bg-zinc-900/95 backdrop-blur-2xl border border-zinc-800/80 rounded-3xl p-4 sm:p-7 shadow-2xl shadow-black/80 relative transition-all duration-300">
    
    <!-- لایه احراز هویت -->
    <div id="authView" class="hidden">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
        </div>
        <h1 class="text-xl font-bold text-zinc-100">یادداشت کارها</h1>
        <p class="text-xs text-zinc-400 mt-1">ساده، هوشمند و همیشه منظم</p>
      </div>

      <div class="flex bg-zinc-950/60 p-1 rounded-xl border border-zinc-800/80 mb-5">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-1.5 text-xs font-medium rounded-lg transition-all bg-zinc-800 text-zinc-100 shadow-sm">ورود</button>
        <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-1.5 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200">ثبت‌نام</button>
      </div>

      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs text-zinc-400 mb-1 mr-1">نام کاربری</label>
          <input id="authUsername" type="text" required dir="ltr" class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-left">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1 mr-1">رمز عبور</label>
          <input id="authPassword" type="password" required dir="ltr" class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-left">
        </div>
        <p id="authError" class="text-xs text-rose-400 hidden pt-1"></p>
        <button type="submit" id="authSubmitBtn" class="w-full mt-2 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-sm font-medium rounded-xl transition-all shadow-lg shadow-indigo-600/20">ورود به حساب</button>
      </form>
    </div>

    <!-- داشبورد اصلی Todo -->
    <div id="todoView" class="hidden">
      <!-- هدر کاربر -->
      <div class="flex items-center justify-between pb-3.5 border-b border-zinc-800/80 mb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-xs uppercase border border-indigo-500/20" id="userInitial">U</div>
          <div>
            <div class="text-[11px] text-zinc-400">فهرست وظایف</div>
            <div class="text-sm font-semibold text-zinc-200" id="userNameDisplay">کاربر</div>
          </div>
        </div>
        <button onclick="logout()" title="خروج از حساب" class="p-1.5 text-zinc-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
      </div>

      <!-- نوار اسکرولی دسته‌بندی‌ها -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-2 mb-3 custom-scrollbar text-xs" id="categoryChips">
        <!-- چیپ‌ها در جاوااسکریپت پر می‌شوند -->
      </div>

      <!-- فرم ثبت تسک (با زدن Enter ثبت می‌شود) -->
      <form onsubmit="addTodo(event)" class="bg-zinc-950/80 border border-zinc-800/90 rounded-2xl p-2 mb-3 focus-within:border-indigo-500 transition-all shadow-inner">
        <input id="newTodoInput" type="text" placeholder="عنوان کار جدید... (Enter برای ثبت)" required class="w-full bg-transparent px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none">
        <div class="flex items-center justify-between pt-1 px-2 border-t border-zinc-800/40 mt-1 gap-2">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <!-- انتخاب تگ سریع -->
            <input id="newTodoTags" type="text" placeholder="تگ‌ها (با کاما)" class="bg-zinc-900 border border-zinc-800/80 rounded-lg px-2 py-1 text-[11px] text-zinc-300 placeholder-zinc-600 focus:outline-none focus:border-indigo-500 w-28 sm:w-36">
            <!-- دسته‌بندی پیش‌فرض برای تسک جدید -->
            <select id="newTodoCategory" class="bg-zinc-900 border border-zinc-800/80 rounded-lg px-2 py-1 text-[11px] text-zinc-400 focus:outline-none focus:border-indigo-500">
              <option value="">بدون دسته</option>
            </select>
          </div>
          <button type="submit" class="p-1.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-lg transition-all shadow">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </div>
      </form>

      <!-- نوار فیلتر و آمار (دیفالت: فعال‌ها) -->
      <div class="flex items-center justify-between text-xs text-zinc-400 mb-2.5 px-1">
        <span id="pendingCount">۰ کار فعال</span>
        <div class="flex items-center gap-1.5 bg-zinc-950/50 p-1 rounded-lg border border-zinc-800/50">
          <button onclick="setFilter('active')" id="filter-active" class="px-2 py-0.5 rounded-md text-indigo-400 font-medium bg-zinc-800 transition">فعال</button>
          <button onclick="setFilter('all')" id="filter-all" class="px-2 py-0.5 rounded-md hover:text-zinc-200 transition">همه</button>
          <button onclick="setFilter('completed')" id="filter-completed" class="px-2 py-0.5 rounded-md hover:text-zinc-200 transition">تکمیل‌شده</button>
        </div>
      </div>

      <!-- لیست تسک‌ها (قابلیت Drag & Drop) -->
      <ul id="todoList" class="space-y-2 max-h-[50vh] overflow-y-auto pr-0.5 custom-scrollbar min-h-[80px]">
        <!-- کارت‌ها اینجا رندر می‌شوند -->
      </ul>

      <!-- وضعیت خالی بودن -->
      <div id="emptyState" class="hidden text-center py-10">
        <svg class="w-9 h-9 text-zinc-700 mx-auto mb-2 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <p class="text-xs text-zinc-500">کاری در این بخش وجود ندارد</p>
      </div>
    </div>
  </div>

  <!-- مودال ویرایش تسک -->
  <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-2xl">
      <h3 class="text-sm font-bold text-zinc-100 mb-3">ویرایش وظیفه</h3>
      <form onsubmit="saveEditTodo(event)" class="space-y-3">
        <input type="hidden" id="editTodoId">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">عنوان</label>
          <textarea id="editTodoTitle" required rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">دسته‌بندی</label>
          <select id="editTodoCategory" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-indigo-500">
            <option value="">بدون دسته‌بندی</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">تگ‌ها (با کاما جدا کنید)</label>
          <input id="editTodoTags" type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition">ذخیره تغییرات</button>
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs transition">انصراف</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = '/api';
    let todos = [];
    let categories = [];
    let currentFilter = 'active'; // مقدار پیش‌فرض: فعال‌ها
    let selectedCategoryFilter = null; // فیلتر دسته‌بندی انتخابی
    let authMode = 'login';
    let sortableInstance = null;

    function getToken() { return localStorage.getItem('token'); }
    function getUser() { return localStorage.getItem('username'); }

    window.addEventListener('DOMContentLoaded', () => {
      if (getToken()) {
        showTodoView();
      } else {
        showAuthView();
      }
    });

    function showAuthView() {
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('todoView').classList.add('hidden');
    }

    function showTodoView() {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('todoView').classList.remove('hidden');
      const username = getUser() || 'کاربر';
      document.getElementById('userNameDisplay').innerText = username;
      document.getElementById('userInitial').innerText = username.charAt(0).toUpperCase();
      loadData();
      initSortable();
    }

    function initSortable() {
      const el = document.getElementById('todoList');
      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(el, {
        animation: 180,
        handle: '.drag-handle',
        ghostClass: 'sortable-ghost',
        onEnd: async function () {
          const items = Array.from(document.querySelectorAll('#todoList > li'));
          const ordered_ids = items.map(li => Number(li.dataset.id));
          try {
            await authFetch(`${API_URL}/todos/reorder`, {
              method: 'PUT',
              body: JSON.stringify({ ordered_ids })
            });
            // هماهنگ‌سازی ترتیب لوکال
            const idMap = new Map(ordered_ids.map((id, index) => [id, index]));
            todos.sort((a, b) => (idMap.get(a.id) ?? 9999) - (idMap.get(b.id) ?? 9999));
          } catch (e) {
            console.error("خطا در تغییر ترتیب:", e);
          }
        }
      });
    }

    function switchAuthTab(mode) {
      authMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const btn = document.getElementById('authSubmitBtn');
      document.getElementById('authError').classList.add('hidden');

      if (mode === 'login') {
        tabLogin.className = 'flex-1 py-1.5 text-xs font-medium rounded-lg transition-all bg-zinc-800 text-zinc-100 shadow-sm';
        tabRegister.className = 'flex-1 py-1.5 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200';
        btn.innerText = 'ورود به حساب';
      } else {
        tabRegister.className = 'flex-1 py-1.5 text-xs font-medium rounded-lg transition-all bg-zinc-800 text-zinc-100 shadow-sm';
        tabLogin.className = 'flex-1 py-1.5 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200';
        btn.innerText = 'ثبت‌نام در سامانه';
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl = document.getElementById('authError');
      errEl.classList.add('hidden');

      try {
        const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
        const res = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'خطایی رخ داد');

        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        showTodoView();
      } catch (err) {
        errEl.innerText = err.message;
        errEl.classList.remove('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      todos = [];
      categories = [];
      showAuthView();
    }

    async function authFetch(url, options = {}) {
      options.headers = {
        ...options.headers,
        'Authorization': `Bearer ${getToken()}`,
        'Content-Type': 'application/json'
      };
      const res = await fetch(url, options);
      if (res.status === 401) {
        logout();
        throw new Error('نشست شما منقضی شد.');
      }
      return res;
    }

    async function loadData() {
      try {
        const [resTodos, resCats] = await Promise.all([
          authFetch(`${API_URL}/todos`),
          authFetch(`${API_URL}/categories`)
        ]);
        todos = await resTodos.json();
        categories = await resCats.json();
        renderCategories();
        renderTodos();
      } catch (e) {
        console.error(e);
      }
    }

    // --- مدیریت دسته‌بندی‌ها ---
    function renderCategories() {
      const chipsContainer = document.getElementById('categoryChips');
      const newSelect = document.getElementById('newTodoCategory');
      const editSelect = document.getElementById('editTodoCategory');

      // پر کردن Dropdownها
      const optionsHtml = '<option value="">بدون دسته</option>' + 
        categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      newSelect.innerHTML = optionsHtml;
      editSelect.innerHTML = optionsHtml;

      // رندر چیپ‌های بالا
      let html = `
        <button onclick="selectCategory(null)" class="px-2.5 py-1 rounded-xl whitespace-nowrap text-xs transition border ${
          selectedCategoryFilter === null 
            ? 'bg-indigo-600 text-white border-indigo-500' 
            : 'bg-zinc-950/60 text-zinc-400 border-zinc-800 hover:text-zinc-200'
        }">همه دسته‌ها</button>
      `;

      categories.forEach(cat => {
        const isSelected = selectedCategoryFilter === cat.id;
        html += `
          <div class="inline-flex items-center rounded-xl border text-xs whitespace-nowrap overflow-hidden transition ${
            isSelected 
              ? 'bg-indigo-600 text-white border-indigo-500' 
              : 'bg-zinc-950/60 text-zinc-300 border-zinc-800'
          }">
            <button onclick="selectCategory(${cat.id})" class="px-2.5 py-1 text-xs">${escapeHtml(cat.name)}</button>
            <button onclick="deleteCategory(${cat.id})" class="px-1.5 py-1 text-zinc-400 hover:text-rose-300 opacity-60 hover:opacity-100">×</button>
          </div>
        `;
      });

      html += `
        <button onclick="promptNewCategory()" class="px-2 py-1 rounded-xl bg-zinc-900 border border-dashed border-zinc-700 text-zinc-400 hover:text-zinc-200 whitespace-nowrap text-xs transition flex items-center gap-1">
          <span>+ دسته جدید</span>
        </button>
      `;
      chipsContainer.innerHTML = html;
    }

    function selectCategory(catId) {
      selectedCategoryFilter = catId;
      document.getElementById('newTodoCategory').value = catId || '';
      renderCategories();
      renderTodos();
    }

    async function promptNewCategory() {
      const name = prompt('نام دسته‌بندی جدید را وارد کنید:');
      if (!name || !name.trim()) return;
      try {
        const res = await authFetch(`${API_URL}/categories`, {
          method: 'POST',
          body: JSON.stringify({ name: name.trim() })
        });
        const created = await res.json();
        categories.push(created);
        selectCategory(created.id);
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteCategory(id) {
      if (!confirm('آیا این دسته‌بندی حذف شود؟ (تسک‌های داخل آن حذف نمی‌شوند)')) return;
      try {
        await authFetch(`${API_URL}/categories/${id}`, { method: 'DELETE' });
        categories = categories.filter(c => c.id !== id);
        if (selectedCategoryFilter === id) selectedCategoryFilter = null;
        // به‌روزرسانی لوکال تسک‌ها
        todos.forEach(t => { if (t.category_id === id) { t.category_id = null; t.category_name = null; } });
        renderCategories();
        renderTodos();
      } catch (err) {
        alert(err.message);
      }
    }

    // --- افزودن تسک (با زدن Enter) ---
    async function addTodo(e) {
      e.preventDefault();
      const titleInput = document.getElementById('newTodoInput');
      const tagsInput = document.getElementById('newTodoTags');
      const catInput = document.getElementById('newTodoCategory');

      const title = titleInput.value.trim();
      if (!title) return;

      const payload = {
        title,
        tags: tagsInput.value.trim(),
        category_id: catInput.value ? Number(catInput.value) : null
      };

      try {
        const res = await authFetch(`${API_URL}/todos`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const newTodo = await res.json();
        todos.unshift(newTodo);
        titleInput.value = '';
        tagsInput.value = '';
        renderTodos();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleTodo(id, currentStatus) {
      const target = todos.find(t => t.id === id);
      if (target) target.is_completed = !currentStatus;
      renderTodos();

      try {
        await authFetch(`${API_URL}/todos/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ is_completed: !currentStatus })
        });
      } catch (err) {
        if (target) target.is_completed = currentStatus;
        renderTodos();
      }
    }

    async function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      renderTodos();
      try {
        await authFetch(`${API_URL}/todos/${id}`, { method: 'DELETE' });
      } catch (err) {
        loadData();
      }
    }

    // --- ویرایش تسک ---
    function openEditModal(id) {
      const item = todos.find(t => t.id === id);
      if (!item) return;

      document.getElementById('editTodoId').value = item.id;
      document.getElementById('editTodoTitle').value = item.title;
      document.getElementById('editTodoCategory').value = item.category_id || '';
      document.getElementById('editTodoTags').value = item.tags || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function saveEditTodo(e) {
      e.preventDefault();
      const id = Number(document.getElementById('editTodoId').value);
      const title = document.getElementById('editTodoTitle').value.trim();
      const category_id = document.getElementById('editTodoCategory').value ? Number(document.getElementById('editTodoCategory').value) : null;
      const tags = document.getElementById('editTodoTags').value.trim();

      const target = todos.find(t => t.id === id);
      if (target) {
        target.title = title;
        target.category_id = category_id;
        target.tags = tags;
        const cat = categories.find(c => c.id === category_id);
        target.category_name = cat ? cat.name : null;
      }
      closeEditModal();
      renderTodos();

      try {
        await authFetch(`${API_URL}/todos/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ title, category_id, tags })
        });
      } catch (err) {
        alert(err.message);
        loadData();
      }
    }

    // --- فیلترها ---
    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'active', 'completed'].forEach(f => {
        const el = document.getElementById(`filter-${f}`);
        if (f === filter) {
          el.className = 'px-2 py-0.5 rounded-md text-indigo-400 font-medium bg-zinc-800 transition';
        } else {
          el.className = 'px-2 py-0.5 rounded-md hover:text-zinc-200 transition';
        }
      });
      renderTodos();
    }

    // --- رندر لیست ---
    function renderTodos() {
      const list = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');
      const pendingCount = document.getElementById('pendingCount');

      const activeTodos = todos.filter(t => !t.is_completed);
      pendingCount.innerText = `${activeTodos.length} کار فعال`;

      let filtered = todos;
      
      // فیلتر وضعیت (پیش‌فرض فعال)
      if (currentFilter === 'active') filtered = filtered.filter(t => !t.is_completed);
      if (currentFilter === 'completed') filtered = filtered.filter(t => t.is_completed);

      // فیلتر دسته‌بندی
      if (selectedCategoryFilter !== null) {
        filtered = filtered.filter(t => t.category_id === selectedCategoryFilter);
      }

      if (filtered.length === 0) {
        list.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      list.innerHTML = filtered.map(todo => {
        const tagList = (todo.tags || '').split(/[, ]+/).filter(Boolean);
        return `
          <li data-id="${todo.id}" class="group flex items-start justify-between p-3 rounded-2xl bg-zinc-950/40 hover:bg-zinc-950/80 border border-zinc-800/60 transition-all gap-2.5">
            <!-- دستگیره Drag & Drop -->
            <div class="drag-handle cursor-grab active:cursor-grabbing text-zinc-600 hover:text-zinc-400 pt-1 select-none" title="تغییر ترتیب">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
            </div>

            <!-- بدنه تسک -->
            <div class="flex items-start gap-2.5 flex-1 min-w-0">
              <button onclick="toggleTodo(${todo.id}, ${Boolean(todo.is_completed)})" class="mt-0.5 w-5 h-5 rounded-lg flex items-center justify-center border transition-all shrink-0 ${
                todo.is_completed 
                  ? 'bg-indigo-600 border-indigo-600 text-white' 
                  : 'border-zinc-700 hover:border-zinc-500'
              }">
                ${todo.is_completed ? '<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>' : ''}
              </button>

              <div class="flex-1 min-w-0">
                <!-- عنوان کامل بدون هیچ کوتاه‌سازی (Break words) -->
                <p class="text-sm font-medium leading-relaxed break-words select-none transition-all ${
                  todo.is_completed ? 'line-through text-zinc-500' : 'text-zinc-200'
                }">${escapeHtml(todo.title)}</p>

                <!-- برچسب‌ها و تگ‌ها -->
                <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                  ${todo.category_name ? `
                    <span class="inline-flex items-center text-[10px] text-indigo-400 bg-indigo-950/50 border border-indigo-800/50 px-2 py-0.5 rounded-md font-medium">
                      📁 ${escapeHtml(todo.category_name)}
                    </span>
                  ` : ''}

                  ${tagList.map(tag => `
                    <span class="inline-flex items-center text-[10px] text-zinc-400 bg-zinc-900 border border-zinc-800 px-1.5 py-0.5 rounded-md">
                      #${escapeHtml(tag)}
                    </span>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- دکمه‌های عملیاتی (ویرایش و حذف) -->
            <div class="flex items-center gap-1 shrink-0 opacity-80 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
              <button onclick="openEditModal(${todo.id})" title="ویرایش" class="text-zinc-500 hover:text-indigo-400 p-1 rounded-lg hover:bg-zinc-800 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
              <button onclick="deleteTodo(${todo.id})" title="حذف" class="text-zinc-500 hover:text-rose-400 p-1 rounded-lg hover:bg-zinc-800 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </li>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
