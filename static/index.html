<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کارهای من | مینیمال</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #27272a;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-3 sm:p-6 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- کانتینر اصلی -->
  <div class="w-full max-w-md bg-zinc-900/90 backdrop-blur-xl border border-zinc-800/80 rounded-3xl p-5 sm:p-7 shadow-2xl shadow-black/60 relative overflow-hidden transition-all duration-300">
    
    <!-- لایه احراز هویت (ورود / ثبت‌نام) -->
    <div id="authView" class="hidden">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
        </div>
        <h1 class="text-xl font-bold text-zinc-100">یادداشت کارها</h1>
        <p class="text-xs text-zinc-400 mt-1">ساده، سریع و همیشه در دسترس</p>
      </div>

      <div class="flex bg-zinc-950/60 p-1 rounded-xl border border-zinc-800/80 mb-5">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-1.5 text-xs font-medium rounded-lg transition-all bg-zinc-800 text-zinc-100 shadow-sm">ورود</button>
        <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-1.5 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200">ثبت‌نام</button>
      </div>

      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs text-zinc-400 mb-1 mr-1">نام کاربری</label>
          <input id="authUsername" type="text" required dir="ltr" class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-left">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1 mr-1">رمز عبور</label>
          <input id="authPassword" type="password" required dir="ltr" class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-left">
        </div>

        <p id="authError" class="text-xs text-rose-400 hidden pt-1"></p>

        <button type="submit" id="authSubmitBtn" class="w-full mt-2 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-sm font-medium rounded-xl transition-all shadow-lg shadow-indigo-600/20">
          ورود به حساب
        </button>
      </form>
    </div>

    <!-- صفحه اصلی Todo -->
    <div id="todoView" class="hidden">
      <!-- هدر -->
      <div class="flex items-center justify-between pb-4 border-b border-zinc-800/80 mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-xs uppercase border border-indigo-500/20" id="userInitial">U</div>
          <div>
            <div class="text-xs text-zinc-400">خوش آمدید</div>
            <div class="text-sm font-semibold text-zinc-200" id="userNameDisplay">کاربر</div>
          </div>
        </div>
        <button onclick="logout()" title="خروج از حساب" class="p-2 text-zinc-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
      </div>

      <!-- فرم ایجاد تسک سریع -->
      <form onsubmit="addTodo(event)" class="relative flex items-center mb-4">
        <input id="newTodoInput" type="text" placeholder="کار جدیدی برای انجام دارید؟" class="w-full bg-zinc-950/80 border border-zinc-800 rounded-2xl pl-12 pr-4 py-3 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
        <button type="submit" class="absolute left-2.5 p-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        </button>
      </form>

      <!-- فیلتر و آمار -->
      <div class="flex items-center justify-between text-xs text-zinc-400 mb-3 px-1">
        <span id="pendingCount">۰ کار باقی‌مانده</span>
        <div class="flex gap-2">
          <button onclick="setFilter('all')" id="filter-all" class="text-indigo-400 font-medium transition">همه</button>
          <span>•</span>
          <button onclick="setFilter('active')" id="filter-active" class="hover:text-zinc-200 transition">فعال</button>
          <span>•</span>
          <button onclick="setFilter('completed')" id="filter-completed" class="hover:text-zinc-200 transition">تکمیل‌شده</button>
        </div>
      </div>

      <!-- لیست تسک‌ها -->
      <ul id="todoList" class="space-y-2 max-h-[58vh] overflow-y-auto pr-0.5 custom-scrollbar">
        <!-- آیتم‌ها اینجا رندر می‌شوند -->
      </ul>

      <!-- وضعیت خالی بودن لیست -->
      <div id="emptyState" class="hidden text-center py-10">
        <svg class="w-10 h-10 text-zinc-700 mx-auto mb-2 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
        <p class="text-xs text-zinc-500">لیست کارها خالی است!</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api';
    let todos = [];
    let currentFilter = 'all';
    let authMode = 'login'; // 'login' | 'register'

    function getToken() { return localStorage.getItem('token'); }
    function getUser() { return localStorage.getItem('username'); }

    // راه‌اندازی اولیه
    window.addEventListener('DOMContentLoaded', () => {
      if (getToken()) {
        showTodoView();
      } else {
        showAuthView();
      }
    });

    function showAuthView() {
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('todoView').classList.add('hidden');
    }

    function showTodoView() {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('todoView').classList.remove('hidden');
      const username = getUser() || 'کاربر';
      document.getElementById('userNameDisplay').innerText = username;
      document.getElementById('userInitial').innerText = username.charAt(0).toUpperCase();
      loadTodos();
    }

    function switchAuthTab(mode) {
      authMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const btn = document.getElementById('authSubmitBtn');
      document.getElementById('authError').classList.add('hidden');

      if (mode === 'login') {
        tabLogin.className = 'flex-1 py-1.5 text-xs font-medium rounded-lg transition-all bg-zinc-800 text-zinc-100 shadow-sm';
        tabRegister.className = 'flex-1 py-1.5 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200';
        btn.innerText = 'ورود به حساب';
      } else {
        tabRegister.className = 'flex-1 py-1.5 text-xs font-medium rounded-lg transition-all bg-zinc-800 text-zinc-100 shadow-sm';
        tabLogin.className = 'flex-1 py-1.5 text-xs font-medium rounded-lg transition-all text-zinc-400 hover:text-zinc-200';
        btn.innerText = 'ثبت‌نام در سامانه';
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl = document.getElementById('authError');
      errEl.classList.add('hidden');

      try {
        const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
        const res = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'خطایی رخ داد');

        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        document.getElementById('authUsername').value = '';
        document.getElementById('authPassword').value = '';
        showTodoView();
      } catch (err) {
        errEl.innerText = err.message;
        errEl.classList.remove('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      todos = [];
      showAuthView();
    }

    async function authFetch(url, options = {}) {
      options.headers = {
        ...options.headers,
        'Authorization': `Bearer ${getToken()}`,
        'Content-Type': 'application/json'
      };
      const res = await fetch(url, options);
      if (res.status === 401) {
        logout();
        throw new Error('جلسه شما منقضی شد.');
      }
      return res;
    }

    async function loadTodos() {
      try {
        const res = await authFetch(`${API_URL}/todos`);
        todos = await res.json();
        renderTodos();
      } catch (e) {
        console.error(e);
      }
    }

    async function addTodo(e) {
      e.preventDefault();
      const input = document.getElementById('newTodoInput');
      const title = input.value.trim();
      if (!title) return;

      try {
        const res = await authFetch(`${API_URL}/todos`, {
          method: 'POST',
          body: JSON.stringify({ title })
        });
        const newTodo = await res.json();
        todos.unshift(newTodo);
        input.value = '';
        renderTodos();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleTodo(id, currentStatus) {
      // به‌روزرسانی سریع لوکال (Optimistic UI)
      const target = todos.find(t => t.id === id);
      if (target) target.is_completed = !currentStatus;
      renderTodos();

      try {
        await authFetch(`${API_URL}/todos/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ is_completed: !currentStatus })
        });
      } catch (err) {
        if (target) target.is_completed = currentStatus;
        renderTodos();
      }
    }

    async function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      renderTodos();
      try {
        await authFetch(`${API_URL}/todos/${id}`, { method: 'DELETE' });
      } catch (err) {
        loadTodos();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'active', 'completed'].forEach(f => {
        const el = document.getElementById(`filter-${f}`);
        if (f === filter) {
          el.className = 'text-indigo-400 font-medium transition';
        } else {
          el.className = 'hover:text-zinc-200 transition';
        }
      });
      renderTodos();
    }

    function renderTodos() {
      const list = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');
      const pendingCount = document.getElementById('pendingCount');

      const activeTodos = todos.filter(t => !t.is_completed);
      pendingCount.innerText = `${activeTodos.length} کار باقی‌مانده`;

      let filtered = todos;
      if (currentFilter === 'active') filtered = todos.filter(t => !t.is_completed);
      if (currentFilter === 'completed') filtered = todos.filter(t => t.is_completed);

      if (filtered.length === 0) {
        list.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      list.innerHTML = filtered.map(todo => `
        <li class="group flex items-center justify-between p-3 rounded-2xl bg-zinc-950/40 hover:bg-zinc-950/80 border border-zinc-800/60 transition-all">
          <div class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer" onclick="toggleTodo(${todo.id}, ${Boolean(todo.is_completed)})">
            <div class="w-5 h-5 rounded-lg flex items-center justify-center border transition-all ${
              todo.is_completed 
                ? 'bg-indigo-600 border-indigo-600 text-white' 
                : 'border-zinc-700 group-hover:border-zinc-500'
            }">
              ${todo.is_completed ? '<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>' : ''}
            </div>
            <span class="text-sm truncate select-none transition-all ${
              todo.is_completed 
                ? 'line-through text-zinc-500' 
                : 'text-zinc-200'
            }">${escapeHtml(todo.title)}</span>
          </div>
          <button onclick="deleteTodo(${todo.id})" class="text-zinc-600 hover:text-rose-400 p-1.5 opacity-80 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
